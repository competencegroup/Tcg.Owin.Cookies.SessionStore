name: Release Drafter

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      # Draft only. Publishing the release in the GitHub UI creates the v* tag,
      # which runs the publish job in dotnet.yml. This workflow must not publish.
      - uses: release-drafter/release-drafter@v7
        with:
          publish: false
          prerelease: false
